# Local Docker task sandbox. The separate PPO training container needs
# Docker CLI plus access to a trusted host Docker daemon.
- name: swe_rebench
  sandbox:
    provider: docker
    runtime_timeout: 7200
    sandbox_kwargs:
      pull_policy: missing
      pull_timeout: 1200
      start_timeout: 120
  agent:
    name: claude_code
    max_turns: 100
    run_timeout: 3600
  prompt_template:
    - role: user
      content: |-
        Read the following task description and resolve the issue in the current directory.

        Task description:
        {problem_statement}

        Inspect the code, make minimal correct changes, and verify them.
        Do not modify tests or commit changes. Summarize the result.
